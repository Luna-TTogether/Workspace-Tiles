<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Workspace Tiles 图标候选方案</title>
  <desc id="description">Geist 蓝和纯黑白四方块图标在浅色及深色背景上的对比。</desc>
  <rect width="800" height="520" rx="24" fill="#ededed"/>
  <rect x="24" y="72" width="364" height="424" rx="18" fill="#ffffff"/>
  <rect x="412" y="72" width="364" height="424" rx="18" fill="#171717"/>

  <g fill="#171717" font-family="Geist Sans, Arial, sans-serif">
    <text x="24" y="38" font-size="20" font-weight="600">Workspace Tiles · 图标候选</text>
    <text x="206" y="108" font-size="14" text-anchor="middle">浅色背景</text>
  </g>
  <text x="594" y="108" fill="#ededed" font-family="Geist Sans, Arial, sans-serif" font-size="14" text-anchor="middle">深色背景</text>

  <defs>
    <g id="blue-mark" stroke="#171717" stroke-width="5" stroke-linejoin="round">
      <rect x="14" y="14" width="46" height="46" rx="11" fill="#f7f7f7"/>
      <rect x="68" y="14" width="46" height="46" rx="11" fill="#0068d6"/>
      <rect x="14" y="68" width="46" height="46" rx="11" fill="#f7f7f7"/>
      <rect x="68" y="68" width="46" height="46" rx="11" fill="#f7f7f7"/>
    </g>
    <g id="mono-mark" stroke="#171717" stroke-width="5" stroke-linejoin="round">
      <rect x="14" y="14" width="46" height="46" rx="11" fill="#f7f7f7"/>
      <rect x="68" y="14" width="46" height="46" rx="11" fill="#171717" stroke="#f7f7f7"/>
      <rect x="14" y="68" width="46" height="46" rx="11" fill="#f7f7f7"/>
      <rect x="68" y="68" width="46" height="46" rx="11" fill="#f7f7f7"/>
    </g>
  </defs>

  <g font-family="Geist Sans, Arial, sans-serif" font-size="15" font-weight="600">
    <text x="52" y="158" fill="#171717">Geist 蓝</text>
    <text x="440" y="158" fill="#ededed">Geist 蓝</text>
    <text x="52" y="354" fill="#171717">纯黑白</text>
    <text x="440" y="354" fill="#ededed">纯黑白</text>
  </g>

  <g transform="translate(134 166)"><use href="#blue-mark"/></g>
  <g transform="translate(522 166)"><use href="#blue-mark"/></g>
  <g transform="translate(134 362)"><use href="#mono-mark"/></g>
  <g transform="translate(522 362)"><use href="#mono-mark"/></g>

  <g>
    <g transform="translate(300 258) scale(.125)"><use href="#blue-mark"/></g>
    <rect x="297" y="255" width="22" height="22" rx="5" fill="none" stroke="#d4d4d4"/>
    <g transform="translate(688 258) scale(.125)"><use href="#blue-mark"/></g>
    <rect x="685" y="255" width="22" height="22" rx="5" fill="none" stroke="#3d3d3d"/>
    <g transform="translate(300 454) scale(.125)"><use href="#mono-mark"/></g>
    <rect x="297" y="451" width="22" height="22" rx="5" fill="none" stroke="#d4d4d4"/>
    <g transform="translate(688 454) scale(.125)"><use href="#mono-mark"/></g>
    <rect x="685" y="451" width="22" height="22" rx="5" fill="none" stroke="#3d3d3d"/>
  </g>
</svg>
