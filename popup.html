<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workspace Tiles</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/workspace.css">
    <link rel="stylesheet" href="styles/dialogs.css">
    <link rel="stylesheet" href="styles/overlays.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body class="quick-add-body">
    <main class="quick-add-shell" id="quickAddRoot" aria-live="polite" aria-busy="true">
      <section class="dialog small quick-add-dialog" id="loadingView">
        <div class="dialog-content quick-add-loading">
          <span class="quick-add-spinner" aria-hidden="true"></span>
          <p data-i18n="正在添加当前网站">正在添加当前网站</p>
        </div>
      </section>

      <section class="dialog small quick-add-dialog" id="editorView" role="dialog" aria-labelledby="quickAddTitle" hidden>
        <header class="dialog-header">
          <div class="dialog-title">
            <h1 id="quickAddTitle" data-i18n="保存当前页面">保存当前页面</h1>
          </div>
          <button class="icon-button quick-add-close" id="closeButton" type="button" title="关闭" aria-label="关闭" data-i18n-title="关闭" data-i18n-aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
          </button>
        </header>

        <div class="dialog-content quick-add-editor-content">
          <form class="form quick-add-form" id="quickAddForm">
            <div class="quick-add-page-summary">
              <div class="quick-add-site-icon" id="siteIcon" aria-hidden="true"></div>
              <div class="field">
                <label for="siteName" data-i18n="名称">名称</label>
                <input id="siteName" name="name" autocomplete="off" maxlength="80">
                <p class="quick-add-field-help" id="siteDomain"></p>
              </div>
            </div>

            <div class="field">
              <label for="workspaceSelect" data-i18n="workspaceField">工作区</label>
              <select id="workspaceSelect" name="workspace"></select>
            </div>

            <button class="button secondary bulk-add-action quick-add-create-row" id="createFromWindowButton" type="button" aria-haspopup="dialog">
              <span class="bulk-add-action-main">
                <span class="button-label" data-i18n="从当前窗口新建 Workspace">从当前窗口新建 Workspace</span>
              </span>
              <svg class="bulk-add-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
            <p class="quick-add-message error" id="editorError" role="status" hidden></p>
          </form>
        </div>

        <footer class="dialog-footer">
          <button class="button secondary" id="cancelButton" type="button">
            <span class="button-label" data-i18n="取消">取消</span>
          </button>
          <button class="button primary" id="saveButton" type="submit" form="quickAddForm">
            <span class="button-spinner" aria-hidden="true"></span>
            <span class="button-label" data-i18n="保存">保存</span>
          </button>
        </footer>
      </section>

      <section class="dialog small quick-add-dialog" id="emptyView" role="dialog" aria-labelledby="emptyTitle" hidden>
        <header class="dialog-header">
          <div class="dialog-title"><h1 id="emptyTitle" data-i18n="保存当前页面">保存当前页面</h1></div>
          <button class="icon-button quick-add-close" id="emptyCloseButton" type="button" title="关闭" aria-label="关闭" data-i18n-title="关闭" data-i18n-aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </header>
        <div class="dialog-content quick-add-empty-content">
          <section class="quick-add-page-summary">
            <div class="quick-add-site-icon" id="emptySiteIcon" aria-hidden="true"></div>
            <div class="quick-add-empty-page-copy">
              <strong id="emptySiteName"></strong>
              <p class="quick-add-domain" id="emptySiteDomain"></p>
            </div>
          </section>
          <div class="quick-add-empty-message">
            <h2 data-i18n="还没有工作区">还没有工作区</h2>
            <p data-i18n="创建一个工作区来保存当前页面。">创建一个工作区来保存当前页面。</p>
          </div>
          <p class="quick-add-message error" id="emptyError" role="status" hidden></p>
        </div>
        <footer class="dialog-footer quick-add-empty-actions">
          <button class="button secondary" id="createEmptyWorkspaceButton" type="button">
            <span class="button-label" data-i18n="新建空 Workspace">新建空 Workspace</span>
          </button>
          <button class="button primary" id="createWindowWorkspaceButton" type="button">
            <span class="button-label" data-i18n="从当前窗口新建 Workspace">从当前窗口新建 Workspace</span>
          </button>
        </footer>
      </section>

      <section class="dialog small quick-add-dialog" id="stateView" role="dialog" aria-labelledby="stateTitle" hidden>
        <header class="dialog-header">
          <div class="dialog-title">
            <h1 id="stateTitle"></h1>
          </div>
          <button class="icon-button" id="stateCloseButton" type="button" title="关闭" aria-label="关闭" data-i18n-title="关闭" data-i18n-aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </header>
        <div class="dialog-content">
          <p class="quick-add-state-description" id="stateDescription"></p>
          <p class="quick-add-message error" id="stateError" role="status" hidden></p>
        </div>
        <footer class="dialog-footer" id="stateActions"></footer>
      </section>

    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
